name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module zip
        run: |
          ZIP=$(sh build.sh)
          VERSION=$(basename "$ZIP" .zip | sed 's/^module_freemobilesms-//')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module version $VERSION" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
